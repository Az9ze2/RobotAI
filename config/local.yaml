# PC AI Brain Configuration

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  debug: true

# LLM Settings
llm:
  provider: "ollama"
  model: "qwen2.5:7b-instruct"
  api_url: "http://localhost:11434"
  max_tokens: 512
  temperature: 0.7

# Embedding Model
embedding:
  model_name: "BAAI/bge-m3"
  dimension: 1024
  device: "cuda"  # or "cpu"

# Milvus Vector DB
milvus:
  host: "localhost"
  port: 19530
  collection_name: "robot_memory"

# Speech-to-Text
stt:
  provider: "typhoon"  # Options: "whisper", "typhoon"
  
  # Typhoon ASR Settings (when provider = "typhoon")
  typhoon:
    model: "scb10x/typhoon-asr-realtime"
    device: "auto"  # Options: "auto", "cpu", "cuda"
    language: "th"
  
  # Whisper Settings (when provider = "whisper")
  whisper:
    model: "medium"  # whisper model size
    language: "th"
  
  # Common settings
  confidence_threshold: 0.7

# Text Correction (Post-STT Processing)
text_correction:
  enabled: true
  use_llm: true                # Use LLM for advanced corrections
  use_dictionary: true         # Use dictionary for common errors
  llm_temperature: 0.3         # Low temperature for conservative corrections
  max_corrections: 5           # Maximum corrections per text
  skip_if_confident: true      # Skip if STT confidence is high
  confidence_threshold: 0.95   # Threshold for skipping correction


# Text-to-Speech (VachanaTTS)
tts:
  vachana_path: "C:/Users/Win 10 Pro/Desktop/VachanaTTS"
  default_model: "MMS-TTS-THAI-MALEV1"  # Male voice, 22kHz, 0.068s avg
  fallback_model: "MMS-TTS-THAI-MALEV2"  # Backup male voice
  speaking_rate: 1.0
  sample_rate: 22050
  device: "cuda"
  cache_enabled: true

# Database
database:
  path: "./database/metadata.db"

# Session Management
session:
  timeout_seconds: 1800  # 30 minutes
  max_history: 10

# Memory Settings
memory:
  diary_summary_length: 200
  retrieval_top_k: 5
  similarity_threshold: 0.75

# Logging
logging:
  level: "INFO"
  file: "./logs/ai_brain.log"
  rotation: "500 MB"

# Vision System (Face Detection & Recognition)
vision:
  # Face Detection (SCRFD)
  detection:
    model_path: "./models/buffalo_l/det_10g.onnx"  # Use existing 10G model (high accuracy)
    confidence_threshold: 0.5
    nms_threshold: 0.4
    input_size: [640, 640]
    use_tensorrt: false  # Set to true for Jetson Orin with TensorRT
    device: "cpu"  # Change to "cuda" if GPU available
  
  # Tracking (ByteTrack)
  tracking:
    track_thresh: 0.6
    track_buffer: 30
    match_thresh: 0.8
    min_box_area: 100
  
  # Head Pose
  head_pose:
    yaw_threshold: 30.0
    pitch_threshold: 20.0
    roll_threshold: 45.0
  
  # Recognition Trigger
  recognition:
    min_track_frames: 3
    cooldown_seconds: 5.0
    require_attention: true
  
  # Face Recognition (ArcFace)
  face_recognition:
    model_path: "./models/arcface_r100_v1_fp16.onnx"
    embedding_dim: 512
    use_tensorrt: true
    device: "cuda"
  
  # Student Database (Milvus)
  student_db:
    collection_name: "student_faces"
    similarity_threshold: 0.6
    top_k: 1
    embeddings_per_student: 5
    index_type: "IVF_FLAT"
    metric_type: "COSINE"
  
  # Enrollment
  enrollment:
    min_face_size: 112
    max_blur_threshold: 100.0
    required_angles: ["front", "left", "right"]
    quality_threshold: 0.8
